<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home | Thinking</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="../../Images/LOGO1.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../../Images/LOGO1.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../Images/LOGO1.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Thinking">
    <meta name="application-name" content="Thinking">

    <link rel="stylesheet" href="Student-Dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@0.383.0"></script>

</head>

<body class="dark-theme">

    <div class="app">

        <div class="aurora"></div>

        <div class="particles">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>

        <!-- ==========================================
                    SIDEBAR
        =========================================== -->

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-logo">

                <div class="logo-mark">
                    <i data-lucide="brain-circuit"></i>
                </div>

                <div class="logo-text">
                    <h2>Thinking</h2>
                    <span data-i18n="sidebarSubtitle">Student Dashboard</span>
                </div>

            </div>

            <nav class="sidebar-menu">

                <a href="Student-Dashboard.html" class="active">
                    <i data-lucide="layout-dashboard"></i>
                    <span data-i18n="navHome">Home</span>
                </a>

                <a href="../Groups/Groups-Student.html">
                    <i data-lucide="users-round"></i>
                    <span data-i18n="navGroups">Groups</span>
                </a>

                <a href="../Test/Test-Student.html">
                    <i data-lucide="file-check"></i>
                    <span data-i18n="navTest">Test</span>
                </a>

                <a href="../Assignments/Student-Assignments.html">
                    <i data-lucide="clipboard-list"></i>
                    <span data-i18n="navAssignments">Assignments</span>
                </a>

                <a href="../Resources/Resources-Student.html">
                    <i data-lucide="folder-open"></i>
                    <span data-i18n="navResources">Resources</span>
                </a>

                <a href="../Schedule-S/Schedule-Student.html">
                    <i data-lucide="calendar-days"></i>
                    <span data-i18n="navSchedule">Schedule</span>
                </a>

                <a href="../BombiAI/Bombi-AI.html">
                    <i data-lucide="bot"></i>
                    <span data-i18n="navBombi">Bombi AI</span>
                </a>

            </nav>

            <div class="sidebar-user">
                <div class="user-avatar"><i data-lucide="user-round"></i></div>
                <div class="user-info">
                    <h3 id="userName">Student</h3>
                    <p data-i18n="roleStudent">Student</p>
                </div>
            </div>

            <div class="sidebar-footer">
                <a href="#">
                    <i data-lucide="settings"></i>
                    <span data-i18n="footerSettings">Settings</span>
                </a>
                <a href="#" id="logoutLink">
                    <i data-lucide="log-out"></i>
                    <span data-i18n="footerLogout">Logout</span>
                </a>
            </div>

        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- ==========================================
                    MAIN
        =========================================== -->

        <main class="main">

            <!-- TOPBAR -->

            <header class="topbar">

                <div class="topbar-left">

                    <button class="menu-toggle" id="menuToggle" aria-label="Menu">
                        <i data-lucide="menu"></i>
                    </button>

                    <div class="search-box topbar-search">
                        <i data-lucide="search"></i>
                        <input type="text" id="globalSearch" data-i18n-placeholder="searchPlaceholder" placeholder="Search assignments, classes...">
                        <span class="search-kbd" id="searchKbd">Ctrl /</span>
                    </div>

                </div>

                <div class="topbar-right">

                    <div class="dropdown-wrap">
                        <button class="notification-btn" id="notificationBtn" aria-label="Notifications">
                            <i data-lucide="bell"></i>
                            <span class="notification-count">3</span>
                        </button>
                        <div class="dropdown-panel" id="notificationPanel"></div>
                    </div>

                    <button class="lang-toggle" id="langToggle" aria-label="Language">
                        <i data-lucide="languages"></i>
                        <span id="langLabel">EN</span>
                    </button>

                    <button class="theme-toggle" id="themeToggle" aria-label="Theme">
                        <i data-lucide="sun"></i>
                        <div class="toggle-circle"></div>
                        <i data-lucide="moon"></i>
                    </button>

                    <div class="dropdown-wrap">
                        <div class="user-profile" id="profileBtn">
                            <div class="profile-avatar"><i data-lucide="user-round"></i></div>
                            <div class="profile-info">
                                <h4 id="profileName">Student</h4>
                                <p data-i18n="roleStudent">Student</p>
                            </div>
                            <i data-lucide="chevron-down"></i>
                        </div>
                        <div class="dropdown-panel" id="profilePanel"></div>
                    </div>

                </div>

            </header>

            <!-- HERO -->

            <section class="home-hero dashboard-card">

                <div class="home-hero-left">
                    <div class="home-hero-icon"><i data-lucide="layout-dashboard"></i></div>
                    <div>
                        <h1 class="home-title" id="heroTitle">Home</h1>
                        <p data-i18n="pageSubtitle">Here is what is happening in your classes today.</p>
                    </div>
                </div>

                <div class="home-hero-bombi"><i data-lucide="lightbulb"></i></div>

                <a class="primary-btn" href="../BombiAI/Bombi-AI.html">
                    <i data-lucide="bot"></i>
                    <span data-i18n="askBombi">Ask Bombi AI</span>
                </a>

            </section>

            <!-- STAT CARDS -->

            <section class="quick-cards-row" id="statsRow"></section>

            <!-- GRID: ASSIGNMENTS + SCHEDULE -->

            <section class="home-grid">

                <div class="dashboard-card">
                    <div class="card-header">
                        <h2 class="panel-title" data-i18n="upcomingTitle">Upcoming assignments</h2>
                        <a class="view-all-link" href="../Assignments/Student-Assignments.html">
                            <span data-i18n="viewAll">View all</span>
                            <i data-lucide="chevron-right"></i>
                        </a>
                    </div>
                    <div class="item-list" id="assignmentList"></div>
                </div>

                <div class="dashboard-card">
                    <div class="card-header">
                        <h2 class="panel-title" data-i18n="todayTitle">Today's classes</h2>
                        <a class="view-all-link" href="../Schedule-S/Schedule-Student.html">
                            <span data-i18n="viewAll">View all</span>
                            <i data-lucide="chevron-right"></i>
                        </a>
                    </div>
                    <div class="item-list" id="scheduleList"></div>
                </div>

            </section>

            <!-- LEARNING STYLE -->

            <section class="dashboard-card">

                <div class="card-header">
                    <h2 class="panel-title" data-i18n="styleTitle">Your learning style</h2>
                </div>

                <div class="style-bars" id="styleBars"></div>

            </section>

        </main>

    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="Student-Dashboard.js"></script>

</body>

</html>
