<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thinking Student Register</title>
<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="Images/LOGO1.png">
<link rel="icon" type="image/png" sizes="192x192" href="Images/LOGO1.png">
<link rel="apple-touch-icon" sizes="180x180" href="Images/LOGO1.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thinking">
<meta name="application-name" content="Thinking">
<link rel="stylesheet" href="STUDENT_REGISTER.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<a href="ROLE.html" class="home-btn">

🏠 BACK

</a>


<div class="container">

<!-- IZQUIERDA -->

<div class="left-side">


<div class="students-tag">

🎓 Join thousands of students

</div>


<h1>

Start your learning journey
and become your
<span>best version.</span>

</h1>


<p>

Discover your learning style,
improve study habits,
and reach your goals faster.

</p>

</div>



<!-- DERECHA -->

<div class="right-side">

<h2>

Student Register

</h2>

<h3>

Create your account

</h3>

<p class="thinking-text">

Start learning with
<span>Thinking.</span>

</p>


<form id="student-form">

<label>Full Name</label>

<input
type="text"
id="name"
placeholder="Enter your full name"
required
>


<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required
>


<label>School / Institution</label>

<input
type="text"
id="school"
placeholder="Enter your school"
required
>


<label>Grade</label>

<input
type="text"
id="grade"
placeholder="Enter your grade"
required
>


<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password"
required
>


<label>Confirm Password</label>

<input
type="password"
id="confirm-password"
placeholder="Confirm your password"
required
>


<button
type="submit"
class="create-btn">

Create Student Account

</button>

</form>


<div class="divider">

<span></span>

Continue with

<span></span>

</div>


<button class="google-btn">

<img
src="https://cdn-icons-png.flaticon.com/512/281/281764.png"
>

Continue with Google

</button>


</div>

</div>

<script src="STUDENT_REGISTER.js"></script>

</body>
</html>
