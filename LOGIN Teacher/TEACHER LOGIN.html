<h1>

Guide your students and keep
<span>thinking.</span>

</h1>

<p>

No matter where your teaching journey goes,
Thinking helps you organize, inspire,
and support your students.

</p>

</div>



<!-- DERECHA -->

<div class="right-side">

<div class="brain-circle">

🧠

</div>

<h2>

Welcome back

</h2>

<h3>

Teacher Login

</h3>

<p class="thinking-text">

Sign in and continue
<span>Thinking.</span>

</p>


<form id="teacher-login">

<label>Email</label>

<input
id="email"
type="email"
placeholder="Enter your email address"
required
>


<label>Password</label>

<input
id="password"
type="password"
placeholder="Enter your password"
required
>

<a href="#" class="forgot">

Forgot your password?

</a>


<button
type="submit"
class="login-btn">

Sign In

</button>

</form>


<div class="divider">

<span></span>

Continue with

<span></span>

</div>


<button class="google-btn">

<img src="https://cdn-icons-png.flaticon.com/512/281/281764.png">

Continue with Google

</button>

</div>

</div>
