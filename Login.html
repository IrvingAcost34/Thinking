<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Thinking UI</title>

  <!-- Conectar CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="border-3">
    <div class="border-2">
      <div class="border-1">
        <div class="container">
<a href="https://irvingacost34.github.io/Thinking/" class="home-btn">
  ← Home
</a>
          <h1>Thinking</h1>

          <p class="subtitle" id="subtitle">
            Discover Your Learning Style
          </p>

          <!-- SWITCH -->
          <div class="switch">
            <div class="slider" id="slider"></div>
            <button id="btnUp" class="active">Sign Up</button>
            <button id="btnIn">Sign In</button>
          </div>

          <!-- FORM SIGN UP -->
          <div id="signup" class="form active">

            <p class="center">Create your account</p>

            <input class="input" type="text" placeholder="Full Name">

            <input class="input" type="email" placeholder="Email">

            <input class="input" type="password" placeholder="Password">

            <input class="input" type="date">

            <input class="input" type="text" placeholder="School">

            <button class="main-btn">Sign Up</button>

            <p class="center">Or</p>

            <div class="google">
              <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png">
              <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png">
              <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png">
            </div>

          </div>

          <!-- FORM SIGN IN -->
          <div id="signin" class="form">

            <p class="center">Welcome back with Thinking</p>

            <input class="input" type="email" placeholder="Email">

            <input class="input" type="password" placeholder="Password">

            <button class="main-btn">Sign In</button>

          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Conectar JS -->
  <script src="script.js"></script>

</body>
</html>
