<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thinking Teacher Register</title>
<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="Images/LOGO1.png">
<link rel="icon" type="image/png" sizes="192x192" href="Images/LOGO1.png">
<link rel="apple-touch-icon" sizes="180x180" href="Images/LOGO1.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thinking">
<meta name="application-name" content="Thinking">
<link rel="stylesheet" href="REGISTER_TEACHER.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<a href="ROLE.html" class="home-btn">

🏠 BACK

</a>

<div class="container">

<div class="left-side">

<div class="students-tag">

👨‍🏫 Join thousands of teachers

</div>

<h1>

Empower students and shape their
<span>future.</span>

</h1>

<p>

Create your teacher account and access
personalized educational tools.

</p>

</div>


<div class="right-side">

<h2>

Teacher Register

</h2>

<h3>

Create your account

</h3>

<p class="thinking-text">

Start teaching with
<span>Thinking.</span>

</p>


<form id="teacher-form">

<label>Full Name</label>

<input
type="text"
id="name"
placeholder="Enter your full name"
required
>

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required
>

<label>School / Institution</label>

<input
type="text"
id="school"
placeholder="Enter your school"
required
>

<label>Subject</label>

<input
type="text"
id="subject"
placeholder="Example: Mathematics"
required
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Create password"
required
>

<label>Confirm Password</label>

<input
type="password"
id="confirm-password"
placeholder="Confirm password"
required
>

<button
type="submit"
class="create-btn">

Create Teacher Account

</button>

</form>

</div>

</div>

<script src="REGISTER_TEACHER.js"></script>

</body>
</html>
