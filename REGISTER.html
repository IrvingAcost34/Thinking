<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thinking Register</title>

<link rel="stylesheet" href="REGISTER.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

<!-- IZQUIERDA -->

<div class="left-side">

<img src="upscalemedia-transformed.png"
alt="Thinking Illustration"
class="hero-img">

<h1>
Create your account and start your
<span>best version.</span>
</h1>

<p>
Personalize your learning, discover new techniques,
and achieve your goals.
</p>

<button class="students-btn">

✨ Join thousands of students

</button>

</div>


<!-- DERECHA -->

<div class="right-side">

<h2>
Ready to Begin?
</h2>

<h3>
Create your account
</h3>

<p class="thinking-text">

Log in and keep <span>thinking.</span>

</p>


<form>

<label>Name and Surname</label>

<input
type="text"
placeholder="Enter your first and last name"
>

<label>Email</label>

<input
type="email"
placeholder="Enter your email address"
>

<label>Password</label>

<input
type="password"
placeholder="Enter your password"
>

<small>Secure the password</small>

<label>Confirm Password</label>

<input
type="password"
placeholder="Confirm your password"
>

<button
type="submit"
class="create-btn">

Create account

</button>

</form>


<div class="divider">

<span></span>

Continue with

<span></span>

</div>


<button class="google-btn">

<img src="https://cdn-icons-png.flaticon.com/512/281/281764.png">

Continue with Google

</button>

</div>

</div>

</body>
</html>
